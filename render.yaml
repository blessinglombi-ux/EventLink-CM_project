services:
  - type: web
    name: eventlink-cm
    runtime: python
    buildCommand: >
      pip install -r requirements.txt &&
      python manage.py collectstatic --noinput &&
      python manage.py migrate
    startCommand: >
      gunicorn core.wsgi:application
    envVars:
      - key: PYTHON_VERSION
        value: 3.12
      - key: DJANGO_SETTINGS_MODULE
        value: core.settings
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: false
      - key: DATABASE_URL
        fromDatabase:
          name: eventlink-cm-db
          property: connectionString
databases:
  - name: eventlink-cm-db
    databaseName: eventlink_cm
    user: eventlink_cm