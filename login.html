<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>EventLink CM | Login</title>

    <link rel="stylesheet"
          href="css/auth.css">

</head>

<body>


<header class="navbar">

    <a href="index.html" class="logo">
        EventLink <span>CM</span>
    </a>

    <nav>

        <a href="index.html">Home</a>

        <a href="events.html">Events</a>

        <a href="about.html">About</a>

        <a href="contact.html">Contact</a>

        <a href="login.html"
           class="login-btn">
            Login
        </a>

        <a href="register.html"
           class="register-btn">
            Register
        </a>

    </nav>

</header>


<main class="page">

    <div class="form-box">

        <h1>Welcome Back</h1>

        <p class="subtitle">
            Login to your EventLink CM account.
        </p>


        <form onsubmit="loginUser(event)">

            <input
                id="email"
                type="email"
                placeholder="Email"
                required
            >

            <input
                id="password"
                type="password"
                placeholder="Password"
                required
            >

            <button type="submit">
                Login
            </button>

            <p id="message"
               class="message">
            </p>

        </form>


        <p class="account-link">

            Don't have an account?

            <a href="register.html">
                Register
            </a>

        </p>

    </div>

</main>


<footer>
    <p>© 2026 EventLink CM.</p>
</footer>


<script src="js/login.js"></script>

</body>
</html>
