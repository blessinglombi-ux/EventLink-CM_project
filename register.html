<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>EventLink CM | Register</title>

    <link rel="stylesheet"
          href="css/auth.css">

</head>

<body>


<header class="navbar">

    <a href="html/index.html" class="logo">
        EventLink <span>CM</span>
    </a>

    <nav>

        <a href="html/index.html">Home</a>

        <a href="html/events.html">Events</a>

        <a href="html/about.html">About</a>

        <a href="html/contact.html">Contact</a>

        <a href="html/login.html"
           class="login-btn">
            Login
        </a>

        <a href="html/register.html"
           class="register-btn">
            Register
        </a>

    </nav>

</header>


<main class="page">

    <div class="form-box">

        <h1>Create Account</h1>

        <p class="subtitle">
            Join the EventLink CM community.
        </p>


        <form onsubmit="registerUser(event)">

            <input
                id="name"
                type="text"
                placeholder="Full name"
                required
            >

            <input
                id="email"
                type="email"
                placeholder="Email"
                required
            >

            <input
                id="password"
                type="password"
                placeholder="Password"
                required
            >

            <input
                id="confirmPassword"
                type="password"
                placeholder="Confirm password"
                required
            >

            <button type="submit">
                Register
            </button>

            <p id="message"
               class="message">
            </p>

        </form>


        <p class="account-link">

            Already have an account?

            <a href="html/login.html">
                Login
            </a>

        </p>

    </div>

</main>


<footer>
    <p>© 2026 EventLink CM.</p>
</footer>


<script src="js/register.js"></script>

</body>
</html>
