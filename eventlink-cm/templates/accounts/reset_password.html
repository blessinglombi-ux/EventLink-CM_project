{% extends "base.html" %}

{% block title %}
Reset Password | EventLink CM
{% endblock %}


{% block content %}

<section class="auth-page">

    <div class="auth-container single-auth">

        <div class="auth-form-container">

            <div class="auth-header">

                <div class="auth-logo">
                    🔑
                </div>

                <h1>
                    Create new password
                </h1>

                <p>
                    Choose a new password for
                    your EventLink account.
                </p>

            </div>


            <form method="POST">

                {% csrf_token %}


                <div class="form-group">

                    <label>
                        New password
                    </label>

                    <input type="password"
                           name="password"
                           required>

                </div>


                <div class="form-group">

                    <label>
                        Confirm password
                    </label>

                    <input type="password"
                           name="confirm_password"
                           required>

                </div>


                <button type="submit"
                        class="btn btn-primary auth-submit">

                    Reset Password

                </button>

            </form>

        </div>

    </div>

</section>

{% endblock %}
