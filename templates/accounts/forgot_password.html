{% extends "base.html" %}

{% block title %}
Forgot Password | EventLink CM
{% endblock %}


{% block content %}

<section class="auth-page">

    <div class="auth-container single-auth">

        <div class="auth-form-container">

            <div class="auth-header">

                <div class="auth-logo">
                    🔐
                </div>

                <h1>
                    Forgot password?
                </h1>

                <p>
                    Enter your email and we'll
                    send instructions to reset it.
                </p>

            </div>


            <form method="POST"
                  action="/forgot-password/">

                {% csrf_token %}


                <div class="form-group">

                    <label>
                        Email address
                    </label>

                    <input type="email"
                           name="email"
                           placeholder="you@example.com"
                           required>

                </div>


                <button type="submit"
                        class="btn btn-primary auth-submit">

                    Send Reset Link

                </button>

            </form>


            <p class="auth-bottom">

                Remember your password?

                <a href="/login/">
                    Back to login
                </a>

            </p>

        </div>

    </div>

</section>

{% endblock %}
