{% extends "base.html" %}

{% block title %}
Participant Registration | EventLink CM
{% endblock %}


{% block content %}

<section class="auth-page">

    <div class="auth-container single-auth">

        <div class="auth-form-container">

            <div class="auth-header">

                <div class="auth-logo">
                    🎟️
                </div>

                <h1>
                    Participant account
                </h1>

                <p>
                    Create an account to discover
                    and register for events.
                </p>

            </div>


            <form method="POST"
                  action="/register/participant/">

                {% csrf_token %}


                <div class="form-two">

                    <div class="form-group">

                        <label>
                            First name
                        </label>

                        <input type="text"
                               name="first_name"
                               placeholder="First name"
                               required>

                    </div>


                    <div class="form-group">

                        <label>
                            Last name
                        </label>

                        <input type="text"
                               name="last_name"
                               placeholder="Last name"
                               required>

                    </div>

                </div>


                <div class="form-group">

                    <label>
                        Email address
                    </label>

                    <input type="email"
                           name="email"
                           placeholder="you@example.com"
                           required>

                </div>


                <div class="form-group">

                    <label>
                        Phone number
                    </label>

                    <input type="tel"
                           name="phone"
                           placeholder="+237 ..."
                           required>

                </div>


                <div class="form-group">

                    <label>
                        Password
                    </label>

                    <input type="password"
                           name="password"
                           id="password"
                           placeholder="Create a password"
                           required>

                </div>


                <div class="form-group">

                    <label>
                        Confirm password
                    </label>

                    <input type="password"
                           name="confirm_password"
                           id="confirmPassword"
                           placeholder="Repeat your password"
                           required>

                </div>


                <label class="checkbox-label">

                    <input type="checkbox"
                           required>

                    <span>
                        I agree to the platform terms.
                    </span>

                </label>


                <button type="submit"
                        class="btn btn-primary auth-submit">

                    Create Participant Account

                </button>

            </form>


            <p class="auth-bottom">

                Already registered?

                <a href="/login/">
                    Sign in
                </a>

            </p>

        </div>

    </div>

</section>

{% endblock %}
