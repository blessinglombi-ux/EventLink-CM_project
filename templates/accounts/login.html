{% extends "base.html" %}

{% block title %}
Login | EventLink CM
{% endblock %}


{% block content %}

<section class="auth-page">

    <div class="auth-container">

        <div class="auth-decoration">

            <span>
                ✦
            </span>

            <h2>
                Welcome back.
            </h2>

            <p>
                Your next event is waiting.
            </p>

        </div>


        <div class="auth-form-container">

            <div class="auth-header">

                <div class="auth-logo">
                    ✦
                </div>

                <h1>
                    Sign in
                </h1>

                <p>
                    Access your EventLink CM account.
                </p>

            </div>


            <form method="POST"
                  action="/login/"
                  id="loginForm">

                {% csrf_token %}


                <div class="form-group">

                    <label for="email">
                        Email address
                    </label>

                    <input type="email"
                           id="email"
                           name="email"
                           placeholder="you@example.com"
                           required>

                </div>


                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <input type="password"
                           id="password"
                           name="password"
                           placeholder="Enter your password"
                           required>

                </div>


                <div class="form-row">

                    <label class="checkbox-label">

                        <input type="checkbox"
                               name="remember">

                        <span>
                            Remember me
                        </span>

                    </label>


                    <a href="/forgot-password/">
                        Forgot password?
                    </a>

                </div>


                <button type="submit"
                        class="btn btn-primary auth-submit">

                    Sign In

                </button>

            </form>


            <div class="auth-divider">
                <span>OR</span>
            </div>


            <p class="auth-bottom">

                Don't have an account?

                <a href="/register/">
                    Create one
                </a>

            </p>

        </div>

    </div>

</section>

{% endblock %}
